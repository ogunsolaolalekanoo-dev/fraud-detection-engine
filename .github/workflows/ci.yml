name: Fraud Detection CI

on:
  push:
    branches:
      - main
      - feature/cloud-platform-v3

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application files
        run: python -m py_compile src/database.py src/serve.py

      - name: Run automated tests
        run: pytest -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag fraud-detection-engine:${{ github.sha }} \
            .
